name: prism_dashboard
description: "PRiSM Dashboard store operations console built with Flutter Web and Material 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^1.8.1
  flutter_riverpod: ^3.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
